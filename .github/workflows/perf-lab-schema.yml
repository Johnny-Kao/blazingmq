name: Schema Allocator Threshold Causality Lab

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-threshold-causality
  cancel-in-progress: true

jobs:
  linux-x86-threshold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - condition: idle
            order: forward
          - condition: idle
            order: reverse
          - condition: sibling-busy
            order: forward
          - condition: sibling-busy
            order: reverse
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_REF: 7981dfc38fbde7edcc11ef36843293b64d96ab08
      A_REF: f9acace32cf3426c920d0bba5c2f25e563ae56ed
      B_REF: 8afc63c8f57124ff230eeb6a1480f2c2d337d968
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          mkdir -p perf-results
          {
            echo "condition=${{ matrix.condition }}"
            echo "order=${{ matrix.order }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
            echo
            uptime
            echo
            systemd-detect-virt || true
            echo
            echo "cpu0_siblings=$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
            echo "cpu0_core=$(cat /sys/devices/system/cpu/cpu0/topology/core_id 2>/dev/null || true)"
            echo "cpu0_package=$(cat /sys/devices/system/cpu/cpu0/topology/physical_package_id 2>/dev/null || true)"
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || true
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux

      - name: Start SMT sibling pressure when requested
        if: matrix.condition == 'sibling-busy'
        shell: bash
        run: |
          set -euo pipefail
          siblings="$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
          sibling="$(echo "$siblings" | tr ',' '\n' | grep -v '^0$' | head -n1 || true)"
          if [[ -z "$sibling" ]]; then
            echo "No SMT sibling exposed; using CPU 1 as contention control."
            sibling=1
          fi
          echo "$sibling" > perf-results/stress-cpu.txt
          nohup taskset -c "$sibling" sh -c 'while :; do :; done' \
            > perf-results/sibling-stress.log 2>&1 &
          echo $! > perf-results/sibling-stress.pid
          sleep 1

      - name: Build and measure threshold matrix
        shell: bash
        run: |
          set -euo pipefail

          source_path="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"

          ref_for() {
            case "$1" in
              base) echo "$BASE_REF" ;;
              a) echo "$A_REF" ;;
              b) echo "$B_REF" ;;
              *) return 2 ;;
            esac
          }

          apply_config() {
            local label="$1"
            local buffer="$2"
            local ref
            ref="$(ref_for "$label")"

            git checkout "$ref" -- "$source_path"
            python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); s2,n=re.subn(r"LocalSequentialAllocator<1024>", "LocalSequentialAllocator<"+sys.argv[2]+">", s, count=1); n == 1 or (_ for _ in ()).throw(RuntimeError("expected one LocalSequentialAllocator<1024>, found %d" % n)); p.write_text(s2)' "$source_path" "$buffer"

            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi
          }

          measure_config() {
            local label="$1"
            local buffer="$2"
            local stem="${label}-buf${buffer}"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.15s \
              --benchmark_repetitions=5 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${stem}.json" \
              --benchmark_out_format=json >/dev/null

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              | tee "perf-results/${stem}-alloc.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 1 >/dev/null
          }

          if [[ "${{ matrix.order }}" == "forward" ]]; then
            sizes=(512 1024 2048 4096 8192)
            variants=(base a b)
          else
            sizes=(8192 4096 2048 1024 512)
            variants=(b a base)
          fi

          for buffer in "${sizes[@]}"; do
            for label in "${variants[@]}"; do
              echo "===== condition=${{ matrix.condition }} order=${{ matrix.order }} variant=$label buffer=$buffer ====="
              apply_config "$label" "$buffer"
              measure_config "$label" "$buffer"
            done
          done

      - name: Save source identities
        run: |
          {
            echo "BASE_REF=$BASE_REF"
            echo "A_REF=$A_REF"
            echo "B_REF=$B_REF"
            echo "HARNESS_SHA=$GITHUB_SHA"
            echo "CONDITION=${{ matrix.condition }}"
            echo "ORDER=${{ matrix.order }}"
          } > perf-results/refs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: schema-threshold-${{ matrix.condition }}-${{ matrix.order }}
          path: perf-results
          retention-days: 7
