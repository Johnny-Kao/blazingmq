name: Schema Local-Buffer Threshold Lab

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-local-buffer-threshold
  cancel-in-progress: true

jobs:
  linux-x86-threshold:
    strategy:
      fail-fast: false
      matrix:
        order:
          - a1024-a512-a2048-a4096-exact1024-heap-heapreserve
          - heapreserve-heap-exact1024-a4096-a2048-a512-a1024
          - a2048-a4096-a1024-a512-heapreserve-exact1024-heap
          - heap-a512-exact1024-a2048-a1024-heapreserve-a4096
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      A_REF: f9acace32cf3426c920d0bba5c2f25e563ae56ed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          mkdir -p perf-results
          {
            echo "order=${{ matrix.order }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            uname -a
            echo
            lscpu
            echo
            lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE,MAXMHZ,MINMHZ 2>/dev/null || true
            echo
            free -h
            echo
            uptime
            echo
            systemd-detect-virt || true
            echo
            grep -E 'model name|cpu MHz|siblings|cpu cores' /proc/cpuinfo | head -n 32 || true
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev

      - name: Build and measure threshold variants on same runner
        shell: bash
        run: |
          set -euo pipefail
          source_path="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"

          write_variant() {
            local label="$1"
            git checkout "$A_REF" -- "$source_path"
            LABEL="$label" python3 - <<'PY'
import os
from pathlib import Path
p = Path("src/groups/bmq/bmqp/bmqp_schemagenerator.cpp")
s = p.read_text()
label = os.environ["LABEL"]

if label.startswith("a") and label[1:].isdigit():
    size = label[1:]
    s = s.replace("LocalSequentialAllocator<1024>", f"LocalSequentialAllocator<{size}>", 1)
elif label == "heap":
    s = s.replace(
        "    bdlma::LocalSequentialAllocator<1024> localAllocator(d_allocator_p);\n"
        "    MessagePropertiesIterator             it(mps);\n"
        "    bsl::string                           key(&localAllocator);",
        "    MessagePropertiesIterator it(mps);\n"
        "    bsl::string               key(d_allocator_p);",
        1,
    )
elif label in ("exact1024", "heapreserve"):
    allocator = "&localAllocator" if label == "exact1024" else "d_allocator_p"
    prefix = (
        "    bdlma::LocalSequentialAllocator<1024> localAllocator(d_allocator_p);\n"
        if label == "exact1024" else ""
    )
    old = (
        "    bdlma::LocalSequentialAllocator<1024> localAllocator(d_allocator_p);\n"
        "    MessagePropertiesIterator             it(mps);\n"
        "    bsl::string                           key(&localAllocator);"
    )
    new = (
        prefix
        + "    MessagePropertiesIterator sizingIt(mps);\n"
        + "    bsl::size_t keyLength = 0;\n"
        + "    while (sizingIt.hasNext()) {\n"
        + "        keyLength += 1 + sizingIt.name().size();\n"
        + "    }\n"
        + "    MessagePropertiesIterator it(mps);\n"
        + f"    bsl::string key({allocator});\n"
        + "    key.reserve(keyLength);"
    )
    s = s.replace(old, new, 1)
else:
    raise SystemExit(f"unknown variant: {label}")

p.write_text(s)
PY
          }

          build_variant() {
            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi
          }

          run_bench() {
            if command -v taskset >/dev/null 2>&1; then
              taskset -c 0 "$@"
            else
              "$@"
            fi
          }

          measure_variant() {
            local label="$1"
            echo "===== $label ====="
            git diff -- "$source_path" > "perf-results/${label}-source.diff"

            run_bench ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.08s \
              --benchmark_repetitions=1 >/dev/null

            run_bench ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.15s \
              --benchmark_repetitions=5 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${label}-generator.json" \
              --benchmark_out_format=json

            run_bench ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              | tee "perf-results/${label}-alloc.txt"

            run_bench ./build/blazingmq/tests/bmqp_schemagenerator.t 1
          }

          IFS='-' read -ra labels <<< "${{ matrix.order }}"
          for label in "${labels[@]}"; do
            write_variant "$label"
            build_variant
            measure_variant "$label"
          done

      - name: Save identities
        run: |
          {
            echo "A_REF=$A_REF"
            echo "HARNESS_SHA=$GITHUB_SHA"
            echo "ORDER=${{ matrix.order }}"
            echo "CPU_PIN=0"
          } > perf-results/refs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: schema-threshold-${{ strategy.job-index }}
          path: perf-results
          retention-days: 7
