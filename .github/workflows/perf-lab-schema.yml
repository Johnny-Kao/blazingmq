name: Schema Minimal Key Evaluation
on:
  push:
    branches: [research/blazingmq-minimal-key-eval]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schema-minimal-key-eval
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    env:
      PR1_REF: 8f30d3b7f05a41167e229ee3787fa0b769dcbc4e
      P2A_REF: 1e90f5758560adda3e0d85bf1dfeaf4d1a7bfc25
      P2E_REF: 61abf5c7e647ca24b1a899f03a46f6c3677be653
      EXACT_REF: 5b3d456becbb66e293df3fffc25b3f94e86526d8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record runner and install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          { date -u; uname -a; lscpu; free -h; systemd-detect-virt || true; } > perf-results/environment.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux time valgrind
          echo "Static OpenSSL link check (before building BDE):"
          pkg-config --libs --static libcrypto
          printf 'int main() { return 0; }\n' |
            c++ -x c++ - -o /tmp/openssl-link-smoke $(pkg-config --libs --static libcrypto)
          /tmp/openssl-link-smoke
      - name: Build and validate all variants
        shell: bash
        run: |
          set -euo pipefail
          cpp=src/groups/bmq/bmqp/bmqp_schemagenerator.cpp
          ref_for() {
            case "$1" in
              pr1) echo "$PR1_REF";;
              p2a) echo "$P2A_REF";;
              exact) echo "$EXACT_REF";;
              direct) echo "$GITHUB_SHA";;
              p2e) echo "$P2E_REF";;
              *) return 2;;
            esac
          }
          if [[ "${{ matrix.order }}" == forward ]]; then
            labels=(pr1 exact direct p2e p2a)
          else
            labels=(p2a p2e direct exact pr1)
          fi
          for label in "${labels[@]}"; do
            echo "===== ${{ matrix.order }} $label ====="
            git checkout "$(ref_for "$label")" -- "$cpp"
            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh > "perf-results/build-$label.log" 2>&1 || {
                tail -n 100 "perf-results/build-$label.log"; exit 1;
              }
            else
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64 > "perf-results/config-$label.log" 2>&1
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t \
                > "perf-results/build-$label.log" 2>&1 || {
                  tail -n 100 "perf-results/build-$label.log"; exit 1;
                }
            fi
            ./build/blazingmq/tests/bmqp_schemagenerator.t 1 > "perf-results/$label-correctness.txt"
            ./build/blazingmq/tests/bmqp_schemagenerator.t 2 > "perf-results/$label-allocator.txt"
            if [[ "$label" == direct || "$label" == exact || "$label" == p2e ]]; then
              ./build/blazingmq/tests/bmqp_schemagenerator.t 4 > "perf-results/$label-exception.txt"
              valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=definite,possible \
                ./build/blazingmq/tests/bmqp_schemagenerator.t 4 \
                > "perf-results/$label-valgrind.txt" 2> "perf-results/$label-valgrind-errors.txt"
            fi
            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.12s --benchmark_repetitions=4 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/$label-bench.json" \
              --benchmark_out_format=json > /dev/null
            if [[ "$label" == p2a || "$label" == p2e || "$label" == direct || "$label" == exact ]]; then
              /usr/bin/time -v ./build/blazingmq/tests/bmqp_schemagenerator.t 3 \
                > "perf-results/$label-convergence.txt" \
                2> "perf-results/$label-convergence-time.txt"
            fi
          done
      - name: Summarize median CPU comparisons
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, statistics, os
          root=pathlib.Path("perf-results")
          def read(name):
              p=root / f"{name}-bench.json"
              if not p.exists(): return {}
              obj=json.loads(p.read_text())
              return {r["name"].removesuffix("_median"):float(r["cpu_time"]) for r in obj["benchmarks"] if r.get("aggregate_name")=="median"}
          data={k:read(k) for k in ("pr1","direct","exact","p2a","p2e")}
          lines=["## BDE buffer reuse evaluation", ""]
          for target in ("direct","exact","p2e","p2a"):
              for old in ("pr1", "p2a"):
                  if old == target: continue
                  keys=data[old].keys() & data[target].keys()
                  if not keys:
                      lines.append(f"{target} vs {old}: no comparable data")
                      continue
                  ratios=[data[target][k]/data[old][k] for k in keys]
                  lines.append(f"{target} vs {old}: {sum(x<1 for x in ratios)}/{len(ratios)} faster; median CPU-time reduction {(1-statistics.median(ratios))*100:.2f}%; worst-case regression {(max(ratios)-1)*100:+.2f}%")
          result="\n".join(lines)+"\n"
          print(result)
          root.joinpath("summary.md").write_text(result)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-bde-reuse-${{ matrix.order }}
          path: perf-results
          retention-days: 14
          if-no-files-found: warn
