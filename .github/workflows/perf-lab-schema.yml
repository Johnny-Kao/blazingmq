name: Schema PR2 Builder Screen

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-pr2-builder-screen
  cancel-in-progress: true

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - condition: idle
            order: forward
          - condition: idle
            order: reverse
          - condition: sibling-busy
            order: forward
          - condition: sibling-busy
            order: reverse
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      L1_REF: a8cf6ece379cc7e2099ae43ad7c42712a2e15d5b
      P2A_REF: bf59be3b3daaa939dfc86e3cb93697312e769c42
      P2C_REF: acd4ad66a2ce5508ba99a1b354f8885ffe20443c
      P2D_REF: 7891434590dbb7923263a51c615cfd85c07f27a8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          mkdir -p perf-results
          {
            echo "condition=${{ matrix.condition }}"
            echo "order=${{ matrix.order }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            uname -a
            lscpu
            free -h
            systemd-detect-virt || true
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux time

      - name: Start SMT sibling pressure when requested
        if: matrix.condition == 'sibling-busy'
        shell: bash
        run: |
          set -euo pipefail
          siblings="$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
          sibling="$(echo "$siblings" | tr ',' '\n' | grep -v '^0$' | head -n1 || true)"
          if [[ -z "$sibling" ]]; then sibling=1; fi
          nohup taskset -c "$sibling" sh -c 'while :; do :; done' >/dev/null 2>&1 &
          echo $! > perf-results/sibling-stress.pid
          sleep 1

      - name: Build and measure builders
        shell: bash
        run: |
          set -euo pipefail
          cpp="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"
          hdr="src/groups/bmq/bmqp/bmqp_schemagenerator.h"

          ref_for() {
            case "$1" in
              l1)  echo "$L1_REF" ;;
              p2a) echo "$P2A_REF" ;;
              p2c) echo "$P2C_REF" ;;
              p2d) echo "$P2D_REF" ;;
              *) return 2 ;;
            esac
          }

          build_and_measure() {
            local label="$1"
            local ref="$(ref_for "$label")"
            git checkout "$ref" -- "$cpp" "$hdr"

            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi

            ./build/blazingmq/tests/bmqp_schemagenerator.t 1 > "perf-results/${label}-correctness.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.20s \
              --benchmark_repetitions=7 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${label}-cliff-grid.json" \
              --benchmark_out_format=json >/dev/null

            /usr/bin/time -v ./build/blazingmq/tests/bmqp_schemagenerator.t 3 \
              > "perf-results/${label}-convergence.txt" \
              2> "perf-results/${label}-process-time.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              > "perf-results/${label}-alloc.txt"
          }

          if [[ "${{ matrix.order }}" == "forward" ]]; then
            configs=(l1 p2a p2c p2d)
          else
            configs=(p2d p2c p2a l1)
          fi

          for label in "${configs[@]}"; do
            echo "===== ${{ matrix.condition }} / ${{ matrix.order }} / $label ====="
            build_and_measure "$label"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: schema-pr2-builder-${{ matrix.condition }}-${{ matrix.order }}
          path: perf-results
          retention-days: 7
