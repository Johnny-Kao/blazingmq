name: Schema Perf Lab

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-perf-signoff
  cancel-in-progress: true

jobs:
  linux-x86-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASELINE_SHA: 7981dfc38fbde7edcc11ef36843293b64d96ab08
      VARIANT_SHA: f9acace32cf3426c920d0bba5c2f25e563ae56ed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          uname -a
          lscpu
          free -h
          uptime
          systemd-detect-virt || true
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || true

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev

      - name: Build baseline
        run: |
          # Keep the current benchmark/signoff harness fixed, and switch only
          # the two production sources under test.
          git checkout "$BASELINE_SHA" --             src/groups/bmq/bmqp/bmqp_schemagenerator.cpp             src/groups/bmq/bmqp/bmqp_schemalearner.cpp
          bin/build-ubuntu.sh

      - name: Baseline warmup
        run: |
          ./build/blazingmq/tests/bmqp_schemagenerator.t -1 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -1 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -2 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -3 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -3 --benchmark_min_time=0.1s --benchmark_repetitions=1

      - name: Baseline measured
        run: |
          mkdir -p perf-results
          ./build/blazingmq/tests/bmqp_schemagenerator.t -1 --benchmark_min_time=0.3s --benchmark_repetitions=9 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/baseline-generator.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -1 --benchmark_min_time=0.3s --benchmark_repetitions=11 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/baseline-multiplex.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -2 --benchmark_min_time=0.3s --benchmark_repetitions=11 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/baseline-demultiplex.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -3 --benchmark_min_time=0.2s --benchmark_repetitions=7 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/baseline-hit-rate.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemagenerator.t 2 | tee perf-results/baseline-generator-alloc.txt
          ./build/blazingmq/tests/bmqp_schemalearner.t 8 | tee perf-results/baseline-learner-alloc.txt

      - name: Build variant incrementally on same runner
        run: |
          git checkout "$VARIANT_SHA" --             src/groups/bmq/bmqp/bmqp_schemagenerator.cpp             src/groups/bmq/bmqp/bmqp_schemalearner.cpp
          DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" cmake --preset ubuntu-x64
          DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t bmqp_schemalearner.t

      - name: Variant warmup
        run: |
          ./build/blazingmq/tests/bmqp_schemagenerator.t -1 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -1 --benchmark_min_time=0.1s --benchmark_repetitions=1
          ./build/blazingmq/tests/bmqp_schemalearner.t -2 --benchmark_min_time=0.1s --benchmark_repetitions=1

      - name: Variant measured
        run: |
          ./build/blazingmq/tests/bmqp_schemagenerator.t -1 --benchmark_min_time=0.3s --benchmark_repetitions=9 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/variant-generator.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -1 --benchmark_min_time=0.3s --benchmark_repetitions=11 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/variant-multiplex.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -2 --benchmark_min_time=0.3s --benchmark_repetitions=11 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/variant-demultiplex.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemalearner.t -3 --benchmark_min_time=0.2s --benchmark_repetitions=7 --benchmark_report_aggregates_only=true --benchmark_out=perf-results/variant-hit-rate.json --benchmark_out_format=json
          ./build/blazingmq/tests/bmqp_schemagenerator.t 2 | tee perf-results/variant-generator-alloc.txt
          ./build/blazingmq/tests/bmqp_schemalearner.t 8 | tee perf-results/variant-learner-alloc.txt

      - name: Functional checks on variant
        run: |
          ./build/blazingmq/tests/bmqp_schemagenerator.t 1
          for i in 1 2 3 4 5 6 7; do ./build/blazingmq/tests/bmqp_schemalearner.t "$i"; done

      - uses: actions/upload-artifact@v4
        with:
          name: schema-perf-results
          path: perf-results
          retention-days: 7
