name: Schema Key Strategy Comparison Lab

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-key-strategy-comparison
  cancel-in-progress: true

jobs:
  linux-x86-comparison:
    strategy:
      fail-fast: false
      matrix:
        include:
          - condition: idle
            order: forward
          - condition: idle
            order: reverse
          - condition: sibling-busy
            order: forward
          - condition: sibling-busy
            order: reverse
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BASE_REF: 7981dfc38fbde7edcc11ef36843293b64d96ab08
      L1_REF: f9acace32cf3426c920d0bba5c2f25e563ae56ed
      V1_REF: 5b3d456becbb66e293df3fffc25b3f94e86526d8
      V2_REF: e149f00f84e3cff9ccd900fdd291b89fe7eaca75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          mkdir -p perf-results
          {
            echo "condition=${{ matrix.condition }}"
            echo "order=${{ matrix.order }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            uname -a
            lscpu
            free -h
            uptime
            systemd-detect-virt || true
            echo "cpu0_siblings=$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
            echo "cpu0_core=$(cat /sys/devices/system/cpu/cpu0/topology/core_id 2>/dev/null || true)"
            echo "cpu0_package=$(cat /sys/devices/system/cpu/cpu0/topology/physical_package_id 2>/dev/null || true)"
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || true
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux

      - name: Start SMT sibling pressure when requested
        if: matrix.condition == 'sibling-busy'
        shell: bash
        run: |
          set -euo pipefail
          siblings="$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
          sibling="$(echo "$siblings" | tr ',' '\n' | grep -v '^0$' | head -n1 || true)"
          if [[ -z "$sibling" ]]; then
            sibling=1
          fi
          echo "$sibling" > perf-results/stress-cpu.txt
          nohup taskset -c "$sibling" sh -c 'while :; do :; done' \
            > perf-results/sibling-stress.log 2>&1 &
          echo $! > perf-results/sibling-stress.pid
          sleep 1

      - name: Build and measure all schema-key strategies
        shell: bash
        run: |
          set -euo pipefail

          cpp="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"
          hdr="src/groups/bmq/bmqp/bmqp_schemagenerator.h"

          ref_for() {
            case "$1" in
              base) echo "$BASE_REF" ;;
              l1) echo "$L1_REF" ;;
              v1) echo "$V1_REF" ;;
              v2) echo "$V2_REF" ;;
              *) return 2 ;;
            esac
          }

          apply_variant() {
            local label="$1"
            local buffer="$2"
            local ref
            ref="$(ref_for "$label")"

            git checkout "$ref" -- "$cpp" "$hdr"

            if [[ "$label" == "v1" ]]; then
              python3 -c 'import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); s2,n=re.subn(r"LocalSequentialAllocator<1024>", "LocalSequentialAllocator<"+sys.argv[2]+">", s, count=1); n == 1 or (_ for _ in ()).throw(RuntimeError("expected one LocalSequentialAllocator<1024>, found %d" % n)); p.write_text(s2)' "$cpp" "$buffer"
            fi

            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi
          }

          measure_variant() {
            local label="$1"
            local buffer="$2"
            local stem="${label}-buf${buffer}"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.15s \
              --benchmark_repetitions=5 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${stem}.json" \
              --benchmark_out_format=json >/dev/null

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              | tee "perf-results/${stem}-alloc.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 1 >/dev/null
          }

          forward=(
            "base:1024"
            "l1:1024"
            "v1:512"
            "v1:1024"
            "v1:2048"
            "v1:4096"
            "v1:8192"
            "v2:1024"
          )

          if [[ "${{ matrix.order }}" == "forward" ]]; then
            configs=("${forward[@]}")
          else
            configs=()
            for ((i=${#forward[@]}-1; i>=0; --i)); do
              configs+=("${forward[i]}")
            done
          fi

          for config in "${configs[@]}"; do
            label="${config%%:*}"
            buffer="${config##*:}"
            echo "===== condition=${{ matrix.condition }} order=${{ matrix.order }} variant=$label buffer=$buffer ====="
            apply_variant "$label" "$buffer"
            measure_variant "$label" "$buffer"
          done

      - name: Save source identities
        run: |
          {
            echo "BASE_REF=$BASE_REF"
            echo "L1_REF=$L1_REF"
            echo "V1_REF=$V1_REF"
            echo "V2_REF=$V2_REF"
            echo "HARNESS_SHA=$GITHUB_SHA"
            echo "CONDITION=${{ matrix.condition }}"
            echo "ORDER=${{ matrix.order }}"
          } > perf-results/refs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: schema-key-${{ matrix.condition }}-${{ matrix.order }}
          path: perf-results
          retention-days: 7
