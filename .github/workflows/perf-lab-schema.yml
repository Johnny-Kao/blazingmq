name: P2E Repeated Concurrency Validation
on:
  push:
    branches: [research/blazingmq-p2e-concurrency-repeat]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2e-repeated-concurrency
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    env:
      PR1_REF: 8f30d3b7f05a41167e229ee3787fa0b769dcbc4e
      P2A_REF: 1e90f5758560adda3e0d85bf1dfeaf4d1a7bfc25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record runner and install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          { date -u; uname -a; lscpu; free -h; systemd-detect-virt || true; } > perf-results/environment.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux time valgrind
          echo "Static OpenSSL link check (before building BDE):"
          pkg-config --libs --static libcrypto
          printf 'int main() { return 0; }\n' |
            c++ -x c++ - -o /tmp/openssl-link-smoke $(pkg-config --libs --static libcrypto)
          /tmp/openssl-link-smoke
      - name: Build and validate all variants
        shell: bash
        run: |
          set -euo pipefail
          cpp=src/groups/bmq/bmqp/bmqp_schemagenerator.cpp
          ref_for() {
            case "$1" in
              pr1) echo "$PR1_REF";;
              p2a) echo "$P2A_REF";;
              p2e) echo "$GITHUB_SHA";;
              *) return 2;;
            esac
          }
          if [[ "${{ matrix.order }}" == forward ]]; then
            labels=(pr1 p2e p2a)
          else
            labels=(p2a p2e pr1)
          fi
          for label in "${labels[@]}"; do
            echo "===== ${{ matrix.order }} $label ====="
            git checkout "$(ref_for "$label")" -- "$cpp"
            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh > "perf-results/build-$label.log" 2>&1 || {
                tail -n 100 "perf-results/build-$label.log"; exit 1;
              }
            else
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64 > "perf-results/config-$label.log" 2>&1
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t \
                > "perf-results/build-$label.log" 2>&1 || {
                  tail -n 100 "perf-results/build-$label.log"; exit 1;
                }
            fi
            ./build/blazingmq/tests/bmqp_schemagenerator.t 1 > "perf-results/$label-correctness.txt"
            ./build/blazingmq/tests/bmqp_schemagenerator.t 2 > "perf-results/$label-allocator.txt"
            ./build/blazingmq/tests/bmqp_schemagenerator.t 5 > "perf-results/$label-boundary.txt"
            ./build/blazingmq/tests/bmqp_schemagenerator.t 6 > "perf-results/$label-concurrency-stress.txt"
            if [[ "$label" != p2a ]]; then
              ./build/blazingmq/tests/bmqp_schemagenerator.t 4 > "perf-results/$label-exception.txt"
              valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=definite,possible \
                ./build/blazingmq/tests/bmqp_schemagenerator.t 4 \
                > "perf-results/$label-valgrind.txt" 2> "perf-results/$label-valgrind-errors.txt"

            else
              # Research control: record P2A's known exception-safety gap without
              # aborting the full comparative benchmark.
              if ./build/blazingmq/tests/bmqp_schemagenerator.t 4 \
                  > "perf-results/$label-exception.txt" 2>&1; then
                echo "p2a exception test: PASS" > "perf-results/p2a-exception-status.txt"
              else
                echo "p2a exception test: FAIL (known candidate issue)" > "perf-results/p2a-exception-status.txt"
              fi
            fi
            # Three timing passes per variant, preserving paired runner order.
            for repeat in 1 2 3; do
              taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
                --benchmark_min_time=0.12s --benchmark_repetitions=4 \
                --benchmark_report_aggregates_only=true \
                --benchmark_out="perf-results/$label-bench-$repeat.json" \
                --benchmark_out_format=json > /dev/null
              ./build/blazingmq/tests/bmqp_schemagenerator.t 3 \
                > "perf-results/$label-convergence-$repeat.txt"
            done
          done
      - name: Summarize repeated paired CPU and concurrency comparisons
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, statistics, os, re
          root=pathlib.Path("perf-results")
          variants=("pr1","p2e","p2a")
          def bench(name,run):
              p=root / f"{name}-bench-{run}.json"
              if not p.exists(): return {}
              return {x["name"].removesuffix("_median"):float(x["cpu_time"])
                      for x in json.loads(p.read_text())["benchmarks"]
                      if x.get("aggregate_name")=="median"}
          def convergence(name,run):
              p=root / f"{name}-convergence-{run}.txt"
              if not p.exists(): return {}
              data={}
              for line in p.read_text().splitlines():
                  if not line.startswith("CONVERGENCE"): continue
                  z=dict(re.findall(r"(\w+)=([^ ]+)",line))
                  key=(z["schema"],z["target_hit_rate"],z["threads"])
                  data[key]={k:float(z[k]) for k in
                             ("throughput_ops_s","p50_ns","p99_ns")}
              return data
          lines=["## P2E repeated concurrency evaluation", ""]
          for name in variants:
              p=root/f"{name}-concurrency-stress.txt"
              if p.exists():
                  content=p.read_text()
                  m=re.search(r"SCHEMA_STRESS_OK cases=(\d+)",content)
                  failures=[x for x in content.splitlines()
                            if x.startswith("SCHEMA_STRESS ") and "failures=0" not in x]
                  lines.append(f"{name}: stress cases={m.group(1) if m else 'MISSING'}; invariant failures={len(failures)}")
              e=root/f"{name}-exception-status.txt"
              if e.exists(): lines.append(f"{name}: exception injection {e.read_text().strip()}")
          for candidate in ("p2e","p2a"):
              for baseline in ("pr1",) if candidate=="p2a" else ("pr1","p2a"):
                  ratios, throughputs, p50s, p99s=[],[],[],[]
                  for repeat in (1,2,3):
                      aa,bb=bench(candidate,repeat),bench(baseline,repeat)
                      ratios.extend(aa[k]/bb[k] for k in aa.keys() & bb.keys())
                      cc,dd=convergence(candidate,repeat),convergence(baseline,repeat)
                      for k in cc.keys() & dd.keys():
                          throughputs.append(cc[k]["throughput_ops_s"]/dd[k]["throughput_ops_s"])
                          p50s.append(cc[k]["p50_ns"]/dd[k]["p50_ns"])
                          p99s.append(cc[k]["p99_ns"]/dd[k]["p99_ns"])
                  if ratios:
                      lines.append(f"{candidate} vs {baseline}: CPU {len(ratios)} paired cases; median improvement {(1-statistics.median(ratios))*100:.2f}%; faster {sum(x<1 for x in ratios)}/{len(ratios)}; worst regression {(max(ratios)-1)*100:+.2f}%")
                  if throughputs:
                      lines.append(f"{candidate} vs {baseline}: concurrency {len(throughputs)} paired cases; median throughput {(statistics.median(throughputs)-1)*100:+.2f}%; faster {sum(x>1 for x in throughputs)}/{len(throughputs)}; median p50 {(statistics.median(p50s)-1)*100:+.2f}%; median p99 {(statistics.median(p99s)-1)*100:+.2f}%")
          result="\n".join(lines)+"\n"
          print(result)
          root.joinpath("summary.md").write_text(result)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2e-concurrency-${{ matrix.order }}
          path: perf-results
          retention-days: 30
          if-no-files-found: warn
