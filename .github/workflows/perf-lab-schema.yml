name: Schema L1 Nine-Runner Confirmation

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-l1-nine-runner-confirmation
  cancel-in-progress: true

jobs:
  confirm:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - round: 1
            slot: A
            order: base-l1
          - round: 1
            slot: B
            order: l1-base
          - round: 1
            slot: C
            order: abab
          - round: 2
            slot: A
            order: l1-base
          - round: 2
            slot: B
            order: abab
          - round: 2
            slot: C
            order: base-l1
          - round: 3
            slot: A
            order: abab
          - round: 3
            slot: B
            order: base-l1
          - round: 3
            slot: C
            order: l1-base

    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE_REF: 88bbf562b190c04ca4f33edaa9b6dcccb25a08a6
      L1_REF: a8cf6ece379cc7e2099ae43ad7c42712a2e15d5b

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record independent runner identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          {
            echo "round=${{ matrix.round }}"
            echo "slot=${{ matrix.slot }}"
            echo "order=${{ matrix.order }}"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
            echo
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 'vendor_id' /proc/cpuinfo || true
            grep -m1 'cpu family' /proc/cpuinfo || true
            grep -m1 '^model[[:space:]]' /proc/cpuinfo || true
            grep -m1 'stepping' /proc/cpuinfo || true
            echo "cpu0_siblings=$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list 2>/dev/null || true)"
            echo "cpu0_core=$(cat /sys/devices/system/cpu/cpu0/topology/core_id 2>/dev/null || true)"
            echo "cpu0_package=$(cat /sys/devices/system/cpu/cpu0/topology/physical_package_id 2>/dev/null || true)"
            echo
            systemd-detect-virt || true
            uptime
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev util-linux time

      - name: Run paired confirmation sequence
        shell: bash
        run: |
          set -euo pipefail
          cpp="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"
          hdr="src/groups/bmq/bmqp/bmqp_schemagenerator.h"

          build_and_measure() {
            local label="$1"
            local ref="$2"

            git checkout "$ref" -- "$cpp" "$hdr"

            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" DIR_BUILD="$PWD/build" DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi

            ./build/blazingmq/tests/bmqp_schemagenerator.t 1 \
              > "perf-results/${label}-correctness.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.20s \
              --benchmark_repetitions=7 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${label}-hot.json" \
              --benchmark_out_format=json >/dev/null

            /usr/bin/time -v ./build/blazingmq/tests/bmqp_schemagenerator.t 3 \
              > "perf-results/${label}-convergence.txt" \
              2> "perf-results/${label}-process-time.txt"

            taskset -c 0 ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              > "perf-results/${label}-alloc.txt"
          }

          case "${{ matrix.order }}" in
            base-l1)
              build_and_measure base1 "$BASE_REF"
              build_and_measure l1_1 "$L1_REF"
              ;;
            l1-base)
              build_and_measure l1_1 "$L1_REF"
              build_and_measure base1 "$BASE_REF"
              ;;
            abab)
              build_and_measure base1 "$BASE_REF"
              build_and_measure l1_1 "$L1_REF"
              build_and_measure base2 "$BASE_REF"
              build_and_measure l1_2 "$L1_REF"
              ;;
            *)
              echo "unknown order" >&2
              exit 2
              ;;
          esac

      - name: Save identities
        run: |
          {
            echo "BASE_REF=$BASE_REF"
            echo "L1_REF=$L1_REF"
            echo "HARNESS_SHA=$GITHUB_SHA"
            echo "ROUND=${{ matrix.round }}"
            echo "SLOT=${{ matrix.slot }}"
            echo "ORDER=${{ matrix.order }}"
          } > perf-results/refs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: schema-confirm-r${{ matrix.round }}-${{ matrix.slot }}-${{ matrix.order }}
          path: perf-results
          retention-days: 7
