name: Schema Generator Attribution Lab

on:
  push:
    branches:
      - research/blazingmq-perf-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-generator-attribution
  cancel-in-progress: true

jobs:
  linux-x86-attribution:
    strategy:
      fail-fast: false
      matrix:
        order:
          - base-a-b
          - base-b-a
          - a-b-base
          - b-a-base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_REF: 7981dfc38fbde7edcc11ef36843293b64d96ab08
      A_REF: f9acace32cf3426c920d0bba5c2f25e563ae56ed
      B_REF: 8afc63c8f57124ff230eeb6a1480f2c2d337d968
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner environment
        run: |
          mkdir -p perf-results
          {
            echo "order=${{ matrix.order }}"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
            echo
            uptime
            echo
            systemd-detect-virt || true
            echo
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || true
          } | tee perf-results/environment.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential gdb cmake ninja-build pkg-config \
            bison libfl-dev libbenchmark-dev libgmock-dev libgtest-dev libtool \
            libz-dev libssl-dev

      - name: Build and measure Base / A / B on same runner
        shell: bash
        run: |
          set -euo pipefail

          source_path="src/groups/bmq/bmqp/bmqp_schemagenerator.cpp"

          ref_for() {
            case "$1" in
              base) echo "$BASE_REF" ;;
              a) echo "$A_REF" ;;
              b) echo "$B_REF" ;;
              *) return 2 ;;
            esac
          }

          apply_variant() {
            local label="$1"
            local ref
            ref="$(ref_for "$label")"
            git checkout "$ref" -- "$source_path"

            if [[ ! -d thirdparty/bde ]]; then
              bin/build-ubuntu.sh
            else
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --preset ubuntu-x64
              DIR_THIRDPARTY="$PWD/thirdparty" \
              DIR_BUILD="$PWD/build" \
              DIR_INSTALL="$PWD" \
                cmake --build --preset ubuntu-x64 --target bmqp_schemagenerator.t
            fi
          }

          measure_variant() {
            local label="$1"
            echo "===== $label warmup ====="
            ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.10s \
              --benchmark_repetitions=1 >/dev/null

            echo "===== $label measured ====="
            ./build/blazingmq/tests/bmqp_schemagenerator.t -1 \
              --benchmark_min_time=0.20s \
              --benchmark_repetitions=7 \
              --benchmark_report_aggregates_only=true \
              --benchmark_out="perf-results/${label}-generator.json" \
              --benchmark_out_format=json

            ./build/blazingmq/tests/bmqp_schemagenerator.t 2 \
              | tee "perf-results/${label}-alloc.txt"

            ./build/blazingmq/tests/bmqp_schemagenerator.t 1
          }

          IFS='-' read -r first second third <<< "${{ matrix.order }}"
          for label in "$first" "$second" "$third"; do
            apply_variant "$label"
            measure_variant "$label"
          done

      - name: Save source identities
        run: |
          {
            echo "BASE_REF=$BASE_REF"
            echo "A_REF=$A_REF"
            echo "B_REF=$B_REF"
            echo "HARNESS_SHA=$GITHUB_SHA"
            echo "ORDER=${{ matrix.order }}"
          } > perf-results/refs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: schema-generator-${{ matrix.order }}
          path: perf-results
          retention-days: 7
